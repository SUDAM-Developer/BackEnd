name: CI # dev로 머지되기 전에 테스트로 검증하는 워크플로

on:
  pull_request:
    branches: [ "dev" ]  # dev를 대상으로 하는 PR에서 실행

permissions:
  contents: read # 오직 읽기 권한만 부여

jobs:
  test:
    runs-on: ubuntu-latest

    # @SpringBootTest가 뜨려면 DB와 Redis가 떠 있어야 한다.
    # runner의 localhost로 포트가 열려 application-local.yaml(Redis localhost:6379)과 아래 DB_URL에 그대로 맞는다.
    services:
      mysql:
        image: mysql:8.0  # 잠금/격리 수준 동작이 버전에 따라 달라 로컬과 같은 버전으로 고정
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sudam_test
        ports:
          - 3306:3306
        # 컨테이너가 떠도 MySQL이 접속을 받기까지는 시간이 걸리므로 준비될 때까지 기다린다
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # .env는 저장소에 없으므로(gitignore) 플레이스홀더를 채울 값을 직접 넣는다.
    # 전부 테스트 전용 더미이며 운영 값과 무관하다.
    env:
      DB_URL: jdbc:mysql://localhost:3306/sudam_test
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ci-dummy-jwt-secret-key-not-for-production-use
      KAKAO_CLIENT_ID: ci-dummy-kakao-client-id
      KAKAO_CLIENT_SECRET: ci-dummy-kakao-client-secret
      # Base64로 인코딩한 32바이트여야 기동된다 (AccountNumberConverter가 기동 시 길이를 검사)
      ACCOUNT_ENCRYPTION_KEY: Y2ktZHVtbXktYWNjb3VudC1lbmNyeXB0aW9uLWtleSE=

    steps:
      # PR의 소스 코드를 runner 머신 (여기서는 ubuntu-latest)으로 내려받는다.
      - name: Checkout source code
        uses: actions/checkout@v7

      # 프로젝트를 빌드하고 테스트할 수 있도록 JDK 21을 설치한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 실행 환경을 준비하고 의존성 캐시를 설정해 다음 실행부터 빌드를 빠르게 한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 유닛 테스트와 통합 테스트를 포함한 전체 테스트를 실행해 PR 코드를 검증한다.
      - name: Run tests
        run: ./gradlew test

      # 테스트가 실패했을 경우 HTML 테스트 리포트를 아티팩트로 올려 7일간 내려받아 볼 수 있게 한다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7