spring:
  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao

app:
  oauth2:
    success-redirect-uri: http://localhost:8081/login/success
    failure-redirect-uri: http://localhost:8081/login/failure
