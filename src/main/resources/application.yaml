spring:
  application:
    name: sudam
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    defer-datasource-initialization: true

  # MySQL은 기본값(embedded)에서 data.sql을 실행하지 않으므로 always로 켠다.
  sql:
    init:
      mode: always
      encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분
  refresh-token-expiration: 1209600000 # 14일

crypto:
  account-encryption-key: ${ACCOUNT_ENCRYPTION_KEY} # Base64 32바이트. 계좌번호 AES-GCM 암호화 키

# 시연용 가상 데이터 (global/seed). true일 때만 실행기 빈이 생긴다. 시연이 끝나면 끈다.
sudam:
  seed:
    enabled: ${SUDAM_SEED_ENABLED:false}
    teacher-kakao-id: ${SUDAM_SEED_TEACHER_KAKAO_ID:} # 비우면 seed-teacher-1 (가짜 계정, 토큰을 콘솔에 출력)
